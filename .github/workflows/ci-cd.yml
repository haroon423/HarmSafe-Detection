name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v3  # Latest version of checkout

      - name: Set up Python
        uses: actions/setup-python@v3  # Latest version of setup-python
        with:
          python-version: '3.10'  # Use a more recent Python version

      - name: Cache dependencies
        uses: actions/cache@v2
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest --disable-warnings

      # Optional: Only run this step if you want to deploy directly
      - name: Deploy to Streamlit
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          pip install streamlit
          streamlit run app.py --server.port 8501  # Example port

